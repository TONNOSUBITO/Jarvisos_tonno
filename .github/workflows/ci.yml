name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dipendenze
        run: python -m pip install -e ".[dev,voice,tts]"
      - name: Chromium per Playwright
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Chromium per Playwright (Windows)
        run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - name: Test
        run: python -m pytest -q
      - name: Doctor
        run: python -m jarvis doctor
