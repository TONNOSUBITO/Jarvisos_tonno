[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.2.0"
description = "Assistente personale speak-to-action, locale-first (Fase 1: MVP testuale)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "playwright>=1.56",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Voce locale. Versioni provate in cloud il 25/09/2026: faster-whisper 1.2.1, kokoro-onnx 0.6.1, pywhispercpp 1.5.1
voice = ["faster-whisper>=1.2"]
tts = ["kokoro-onnx>=0.6"]
whispercpp = ["pywhispercpp>=1.5"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
