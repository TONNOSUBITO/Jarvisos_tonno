
# ---- Provider di modelli (accodare a config/device.toml) ----
# Ordine = ordine di fallback: prima i gratuiti e veloci, per ultimi quelli a pagamento.
# Le chiavi vanno SOLO nel file .env (qui c'è il NOME della variabile, mai la chiave).
# Un provider senza chiave nel .env viene saltato. I provider con paid = true restano bloccati
# finché in [model] non imposti allow_paid = true e in [limits] un budget_eur > 0.
# Endpoint e nomi dei modelli verificati sulle documentazioni ufficiali il 25/09/2026.

[[model.providers]]
name = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-20b"
api_key_env = "GROQ_API_KEY"

[[model.providers]]
name = "cerebras"
base_url = "https://api.cerebras.ai/v1"
model = "qwen-3.8-27b"
api_key_env = "CEREBRAS_API_KEY"

[[model.providers]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"

[[model.providers]]
name = "mistral"
base_url = "https://api.mistral.ai/v1"
model = "mistral-large-latest"
api_key_env = "MISTRAL_API_KEY"

[[model.providers]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.8-27b:free"     # gratuito, supporta gli strumenti (elenco: openrouter.ai/models)
api_key_env = "OPENROUTER_API_KEY"

[[model.providers]]
name = "cohere"
base_url = "https://api.cohere.ai/compatibility/v1"
model = "command-a-plus-05-2026"
api_key_env = "COHERE_API_KEY"

[[model.providers]]
name = "together"                   # crediti iniziali che scadono: trattato come a pagamento
base_url = "https://api.together.ai/v1"
model = "openai/gpt-oss-120b"       # supporta gli strumenti (docs.together.ai)
api_key_env = "TOGETHER_API_KEY"
paid = true

[[model.providers]]
name = "anthropic"                  # a pagamento; livello di compatibilità "non per produzione"
base_url = "https://api.anthropic.com/v1/"
model = "claude-haiku-4-5-20251001"
api_key_env = "ANTHROPIC_API_KEY"
paid = true
