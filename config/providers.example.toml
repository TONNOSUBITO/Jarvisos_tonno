
# ---- Provider di modelli (accodare a config/device.toml) ----
# Solo caratteri ASCII: si puo' accodare con PowerShell 5.1 senza problemi di codifica.
# Ordine = ordine di fallback: prima i gratuiti e veloci, per ultimi quelli a pagamento.
# Le chiavi vanno SOLO nel file .env (qui c'e' il NOME della variabile, mai la chiave).
# Un provider senza chiave nel .env viene saltato. I provider con paid = true restano bloccati
# finche' in [model] non imposti allow_paid = true e in [limits] un budget_eur > 0.
# Endpoint e nomi dei modelli verificati sulle documentazioni ufficiali il 25/09/2026.

[[model.providers]]
name = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-20b"
api_key_env = "GROQ_API_KEY"

[[model.providers]]
name = "cerebras"
base_url = "https://api.cerebras.ai/v1"
model = "qwen-3.8-27b"
api_key_env = "CEREBRAS_API_KEY"

[[model.providers]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"

[[model.providers]]
name = "mistral"
base_url = "https://api.mistral.ai/v1"
model = "mistral-large-latest"
api_key_env = "MISTRAL_API_KEY"

[[model.providers]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.8-27b:free"     # gratuito, supporta gli strumenti (elenco: openrouter.ai/models)
api_key_env = "OPENROUTER_API_KEY"

[[model.providers]]
name = "cohere"
base_url = "https://api.cohere.ai/compatibility/v1"
model = "command-a-plus-05-2026"
api_key_env = "COHERE_API_KEY"

[[model.providers]]
name = "huggingface"                # router di Hugging Face: piano gratuito con crediti mensili
base_url = "https://router.huggingface.co/v1"
model = "openai/gpt-oss-120b:fastest"
api_key_env = "HF_TOKEN"

[[model.providers]]
name = "nvidia"                     # crediti gratuiti non verificati: trattato come a pagamento
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.1-70b-instruct"
api_key_env = "NVIDIA_API_KEY"
paid = true

[[model.providers]]
name = "together"                   # crediti iniziali che scadono: trattato come a pagamento
base_url = "https://api.together.ai/v1"
model = "openai/gpt-oss-120b"       # supporta gli strumenti (docs.together.ai)
api_key_env = "TOGETHER_API_KEY"
paid = true

[[model.providers]]
name = "anthropic"                  # a pagamento; livello di compatibilita' "non per produzione"
base_url = "https://api.anthropic.com/v1/"
model = "claude-haiku-4-5-20251001"
api_key_env = "ANTHROPIC_API_KEY"
paid = true

[[model.providers]]
name = "deepseek"                   # a pagamento
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
paid = true

[[model.providers]]
name = "fireworks"                  # a pagamento; modello d'esempio della documentazione
base_url = "https://api.fireworks.ai/inference/v1"
model = "accounts/fireworks/models/llama-v3p1-8b-instruct"
api_key_env = "FIREWORKS_API_KEY"
paid = true

[[model.providers]]
name = "openai"                     # a pagamento: 0.1 / 0.5 USD per milione di token
base_url = "https://api.openai.com/v1"
model = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"
paid = true

[[model.providers]]
name = "xai"                        # a pagamento: da 1.25 / 2.50 USD per milione di token
base_url = "https://api.x.ai/v1"
model = "grok-4.3"
api_key_env = "XAI_API_KEY"
paid = true
