# Copia in config/device.toml (non committato) e adatta al dispositivo.
# Ciò che non è configurato è NEGATO.

[device]
device_id = "portatile"          # es. "portatile" o "fisso": uno per PC
# platform = "windows"           # rilevata automaticamente se omessa
data_dir = "data"                # audit, profilo browser dedicato
vault_dir = "data/vault"         # oppure una vault Obsidian dedicata (non quella personale intera)
app_adapter = "mock"             # "native" per aprire davvero le app (Fase 2, sul PC)

# App approvate: nome pronunciato → comando come lista (niente shell).
[apps]
# Windows:
# calcolatrice = ["calc.exe"]
# blocco note = ["notepad.exe"]
# Linux:
# calcolatrice = ["gnome-calculator"]
# editor = ["gedit"]

# auto | confirm | deny
[permissions]
"app.open" = "auto"
"web.search" = "auto"
"web.open" = "auto"
"notes.draft" = "auto"
"notes.save" = "confirm"
"model.chat" = "deny"
"shell.exec" = "deny"            # obbligatorio: non supportato

[limits]
task_timeout_s = 60
tool_timeout_s = 30
confirm_timeout_s = 300
max_steps = 8
budget_eur = 0.0

[browser]
headless = false
search_url = "https://html.duckduckgo.com/html/?q={q}"   # selettore non verificato in cloud
result_selector = "a.result__a"
allowed_domains = []             # vuoto = tutti i domini http/https pubblici
allow_local_network = false
max_results = 5
max_page_chars = 2000

[model]                          # Fase 3: disattivato
enabled = false
base_url = ""                    # es. OmniRoute locale: http://127.0.0.1:20128/v1
model = ""
allow_paid = false
