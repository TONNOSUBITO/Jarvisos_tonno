# Copia in config/device.toml (non committato) e adatta al dispositivo.
# Ciò che non è configurato è NEGATO.

[device]
device_id = "portatile"          # es. "portatile" o "fisso": uno per PC
data_dir = "data"                # audit, profilo browser dedicato, modelli voce
vault_dir = "data/vault"         # oppure una vault Obsidian DEDICATA (non quella personale intera)
# work_dir = "C:/Users/tuonome/Documents/Jarvis"   # unica cartella in cui Jarvis gestisce file
app_adapter = "mock"             # "native" per aprire davvero le app

# App approvate: nome pronunciato → comando come lista (niente shell).
[apps]
# Windows:
# calcolatrice = ["calc.exe"]
# "blocco note" = ["notepad.exe"]
# esplora file = ["explorer.exe"]
# Linux:
# calcolatrice = ["gnome-calculator"]
# editor = ["gedit"]

# auto | confirm | deny
[permissions]
"app.open" = "auto"
"web.search" = "auto"
"web.open" = "auto"
"notes.save" = "confirm"
"memory.remember" = "confirm"
"memory.list" = "auto"
"memory.forget" = "confirm"
"vault.search" = "auto"
"files.list" = "auto"
"files.read" = "auto"
"files.write" = "confirm"
"files.move" = "confirm"
"files.delete" = "confirm"       # sposta nel cestino .cestino-jarvis, recuperabile
"model.chat" = "deny"            # "auto" per usare i modelli in [model]
"shell.exec" = "deny"            # obbligatorio: non supportato

[limits]
task_timeout_s = 90
tool_timeout_s = 30
confirm_timeout_s = 300
max_steps = 8
budget_eur = 0.0                 # spesa massima per sessione; 0 = nessuna spesa

[browser]
headless = false
search_url = "https://html.duckduckgo.com/html/?q={q}"   # selettore da verificare sul PC
result_selector = "a.result__a"
allowed_domains = []             # vuoto = tutti i domini http/https pubblici
allow_local_network = false
max_results = 5
max_page_chars = 2000

[voice]
stt_engine = "faster-whisper"    # "faster-whisper" | "none"
stt_model = "base"               # "small" solo se il PC regge (misura prima)
stt_language = "it"
tts_engine = "browser"           # "kokoro" (locale) | "browser" | "none"
tts_voice = "if_sara"            # Kokoro: "if_sara" (femminile) o "im_nicola" (maschile)
tts_speed = 1.0
kokoro_model = "data/models/kokoro-v1.0.onnx"
kokoro_voices = "data/models/voices-v1.0.bin"
speak_replies = true
max_audio_s = 30

# Router Jev (TypeSafe), facoltativo: capisce i comandi che le regole non coprono. Vedi README.
# [router]
# engine = "rules+jev"           # serve TYPESAFE_API_KEY nel .env e [limits] budget_eur > 0

[model]                          # livelli 2-3: disattivato finché non lo abiliti
enabled = false
allow_paid = false
timeout_s = 30
agent_tools = true
allow_private_data = false       # true = file/memoria/note possono andare al modello

# Provider: accoda config/providers.example.toml (14 provider verificati, in ordine di fallback).
# La chiave va nel .env: nel TOML solo il NOME della variabile (api_key_env).
